[project]
name = "research-kb"
version = "0.1.0"
description = "A multimodal RAG research knowledge base for US-listed AI infrastructure companies."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.28",
    "langchain>=1.4",
    "langchain-mcp-adapters>=0.2",
    "langchain-milvus>=0.3",
    "langchain-ollama>=1.0",
    "langchain-openai>=1.6",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2",
    "mcp>=1.26",
    "pymupdf>=1.26",
    "pypdf>=6.0",
    "python-dotenv>=1.1",
    "streamlit>=1.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_kb"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
